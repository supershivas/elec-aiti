<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Éditeur de schémas électriques</title>
  <link rel="stylesheet" href="css/design-tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/editor.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1 class="topbar__title">Éditeur de schémas électriques</h1>
      <nav class="menubar" aria-label="Menu principal">
        <div class="menubar__item">
          <button type="button" class="menubar__trigger" id="menu-file-trigger" aria-haspopup="true" aria-expanded="false">Fichier</button>
          <div class="menubar__dropdown" id="menu-file-dropdown" hidden role="menu">
            <button type="button" class="menubar__action" id="menu-new-project" role="menuitem">Nouveau projet</button>
            <hr class="menubar__separator" />
            <button type="button" class="menubar__action" id="menu-save-project" role="menuitem">Enregistrer le projet (.aiti)</button>
            <button type="button" class="menubar__action" id="menu-open-project" role="menuitem">Ouvrir un projet (.aiti)</button>
            <input type="file" id="import-file-input" accept=".aiti" hidden />
            <hr class="menubar__separator" />
            <button type="button" class="menubar__action" id="menu-export-svg" role="menuitem">Exporter en SVG (tous les étages)</button>
            <button type="button" class="menubar__action" id="menu-export-png" role="menuitem">Exporter en PNG (tous les étages)</button>
            <button type="button" class="menubar__action" id="menu-export-pdf" role="menuitem">Exporter en PDF (tous les étages)</button>
            <hr class="menubar__separator" />
            <button type="button" class="menubar__action" id="menu-print" role="menuitem">Imprimer</button>
          </div>
        </div>
        <div class="menubar__item">
          <button type="button" class="menubar__trigger" id="menu-edit-trigger" aria-haspopup="true" aria-expanded="false">Édition</button>
          <div class="menubar__dropdown" id="menu-edit-dropdown" hidden role="menu">
            <button type="button" class="menubar__action" id="menu-undo" role="menuitem">Annuler</button>
            <button type="button" class="menubar__action" id="menu-redo" role="menuitem">Rétablir</button>
            <hr class="menubar__separator" />
            <button type="button" class="menubar__action menubar__action--danger" id="menu-clear" role="menuitem">Effacer tout le plan</button>
          </div>
        </div>
        <div class="menubar__item">
          <button type="button" class="menubar__trigger" id="menu-plan-trigger" aria-haspopup="true" aria-expanded="false">Plan</button>
          <div class="menubar__dropdown" id="menu-plan-dropdown" hidden role="menu">
            <button type="button" class="menubar__action" id="menu-elements-list" role="menuitem">Liste des éléments</button>
            <hr class="menubar__separator" />
            <button type="button" class="menubar__action" id="menu-new-floor" role="menuitem">Nouvel étage</button>
            <button type="button" class="menubar__action" id="menu-duplicate-floor" role="menuitem">Dupliquer cet étage</button>
            <button type="button" class="menubar__action" id="menu-rename-floor" role="menuitem">Renommer cet étage</button>
            <button type="button" class="menubar__action menubar__action--danger" id="menu-delete-floor" role="menuitem">Supprimer cet étage</button>
            <hr class="menubar__separator" />
            <a class="menubar__action" href="beta/" role="menuitem">Version bêta (murs, dessin de plans…)</a>
          </div>
        </div>
      </nav>
    </header>
    <div class="workspace">
      <aside id="palette" class="palette" aria-label="Palette de composants"></aside>
      <main class="stage">
        <div class="stage__overlay stage__overlay--top-left">
          <select id="floor-select" class="floor-select" aria-label="Étage affiché"></select>
        </div>
        <div class="stage__overlay stage__overlay--top-right toolbar__links" role="group" aria-label="Outils">
          <button type="button" id="mode-select" class="toolbar__button toolbar__button--armed">Sélection</button>
          <button type="button" id="mode-wall" class="toolbar__button">Murs</button>
          <button type="button" id="mode-measure" class="toolbar__button">Mesurer</button>
          <label class="toolbar__links-label" for="link-type-select">Liaison</label>
          <select id="link-type-select" class="floor-select" aria-label="Type de liaison"></select>
          <button type="button" id="btn-recenter-view" class="toolbar__button" title="Recentrer la vue sur le plan">Recentrer</button>
        </div>
        <div class="stage__overlay stage__overlay--bottom-left scale-bar" id="scale-bar" aria-hidden="true">
          <span class="scale-bar__line" id="scale-bar-line"></span>
          <span class="scale-bar__label" id="scale-bar-label"></span>
        </div>
        <svg id="stage-svg" class="stage__svg" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <!-- Symboles électriques simplifiés, viewBox 0 0 24 24, dessinés en currentColor -->
            <symbol id="sym-prise" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="8" />
              <line x1="9" y1="9" x2="9" y2="15" />
              <line x1="15" y1="9" x2="15" y2="15" />
            </symbol>
            <symbol id="sym-prise-double" viewBox="0 0 24 24">
              <circle cx="8" cy="12" r="5.5" />
              <line x1="6" y1="9.5" x2="6" y2="14.5" />
              <line x1="10" y1="9.5" x2="10" y2="14.5" />
              <circle cx="16" cy="12" r="5.5" />
              <line x1="14" y1="9.5" x2="14" y2="14.5" />
              <line x1="18" y1="9.5" x2="18" y2="14.5" />
            </symbol>
            <symbol id="sym-prise-etanche" viewBox="0 0 24 24">
              <rect x="3" y="3" width="18" height="18" rx="3" />
              <circle cx="12" cy="12" r="5" />
              <line x1="10" y1="10" x2="10" y2="14" />
              <line x1="14" y1="10" x2="14" y2="14" />
            </symbol>
            <symbol id="sym-prise-specialisee" viewBox="0 0 24 24">
              <!-- Pas de broches dessinées (contrairement à sym-prise) : la place au
                   centre du cercle est laissée libre pour l'abréviation du circuit
                   dédié (voir ComponentsLayer, component__badge). -->
              <circle cx="12" cy="12" r="8" />
              <rect x="16" y="2" width="5" height="5" fill="currentColor" stroke="none" />
            </symbol>
            <symbol id="sym-plafonnier" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="8" />
              <line x1="6.3" y1="6.3" x2="17.7" y2="17.7" />
              <line x1="17.7" y1="6.3" x2="6.3" y2="17.7" />
            </symbol>
            <symbol id="sym-applique" viewBox="0 0 24 24">
              <circle cx="9" cy="12" r="6" />
              <line x1="15" y1="12" x2="21" y2="12" />
              <line x1="14" y1="8" x2="19" y2="4" />
              <line x1="14" y1="16" x2="19" y2="20" />
            </symbol>
            <symbol id="sym-spot" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="8" />
              <circle cx="12" cy="12" r="3.5" fill="currentColor" stroke="none" />
            </symbol>
            <symbol id="sym-interrupteur" viewBox="0 0 24 24">
              <!-- La ligne part du CENTRE du cercle : la partie sous le cercle est masquée
                   par son fond opaque, donc le trait ne dépasse jamais de l'autre côté. -->
              <line x1="8" y1="16" x2="18" y2="6" />
              <line x1="18" y1="6" x2="22" y2="9" />
              <circle cx="8" cy="16" r="4.5" />
            </symbol>
            <symbol id="sym-va-et-vient" viewBox="0 0 40 40">
              <!-- Même geste que l'interrupteur simple, dupliqué de part et d'autre d'un
                   cercle centré : deux branches de taille identique à l'interrupteur simple. -->
              <line x1="20" y1="20" x2="30" y2="10" />
              <line x1="30" y1="10" x2="34" y2="13" />
              <line x1="20" y1="20" x2="10" y2="30" />
              <line x1="10" y1="30" x2="6" y2="27" />
              <circle cx="20" cy="20" r="4.5" />
            </symbol>
            <symbol id="sym-poussoir" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="6" />
              <rect x="9.5" y="9.5" width="5" height="5" />
            </symbol>
            <symbol id="sym-variateur" viewBox="0 0 24 24">
              <line x1="8" y1="16" x2="18" y2="6" />
              <line x1="18" y1="6" x2="22" y2="9" />
              <circle cx="8" cy="16" r="4.5" />
              <!-- Flèche du variateur : traverse la branche en son milieu -->
              <line x1="10.9" y1="8.9" x2="15.1" y2="13.1" />
              <polygon points="15.1,13.1 12.85,12.55 14.55,10.85" fill="currentColor" stroke="none" />
            </symbol>
            <symbol id="sym-tableau" viewBox="0 0 24 24">
              <rect x="3" y="4" width="18" height="16" rx="1" />
              <line x1="8" y1="8" x2="8" y2="16" />
              <line x1="12" y1="8" x2="12" y2="16" />
              <line x1="16" y1="8" x2="16" y2="16" />
            </symbol>
            <symbol id="sym-vmc" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="8" />
              <path d="M12 12 L12 5 A7 7 0 0 1 18.5 9 Z" fill="currentColor" stroke="none" />
              <path d="M12 12 L18.5 15 A7 7 0 0 1 8 18.5 Z" fill="currentColor" stroke="none" />
              <path d="M12 12 L6 15 A7 7 0 0 1 8 6 Z" fill="currentColor" stroke="none" />
            </symbol>
          </defs>
          <g id="plan-layer"></g>
          <g id="rooms-layer"></g>
          <g id="walls-layer"></g>
          <g id="links-layer"></g>
          <g id="components-layer"></g>
          <g id="wall-preview-layer"></g>
          <g id="room-preview-layer"></g>
          <g id="measure-layer"></g>
        </svg>
        <p id="stage-error" class="stage__error" hidden></p>
      </main>
      <aside id="properties-panel" class="properties" aria-label="Propriétés"></aside>
    </div>
  </div>
  <div id="toast-container" class="toast-container" aria-live="polite"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
