<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Éditeur de schémas électriques</title>
  <link rel="stylesheet" href="css/design-tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/editor.css" />
</head>
<body>
  <div class="app">
    <header class="toolbar">
      <h1 class="toolbar__title">Éditeur de schémas électriques</h1>
      <select id="floor-select" class="floor-select" aria-label="Étage affiché"></select>
    </header>
    <div class="workspace">
      <aside id="palette" class="palette" aria-label="Palette de composants"></aside>
      <main class="stage">
        <svg id="stage-svg" class="stage__svg" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <!-- Symboles électriques simplifiés, viewBox 0 0 24 24, dessinés en currentColor -->
            <symbol id="sym-prise" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="8" />
              <line x1="9" y1="9" x2="9" y2="15" />
              <line x1="15" y1="9" x2="15" y2="15" />
            </symbol>
            <symbol id="sym-prise-double" viewBox="0 0 24 24">
              <circle cx="8" cy="12" r="5.5" />
              <line x1="6" y1="9.5" x2="6" y2="14.5" />
              <line x1="10" y1="9.5" x2="10" y2="14.5" />
              <circle cx="16" cy="12" r="5.5" />
              <line x1="14" y1="9.5" x2="14" y2="14.5" />
              <line x1="18" y1="9.5" x2="18" y2="14.5" />
            </symbol>
            <symbol id="sym-prise-etanche" viewBox="0 0 24 24">
              <rect x="3" y="3" width="18" height="18" rx="3" />
              <circle cx="12" cy="12" r="5" />
              <line x1="10" y1="10" x2="10" y2="14" />
              <line x1="14" y1="10" x2="14" y2="14" />
            </symbol>
            <symbol id="sym-prise-specialisee" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="8" />
              <line x1="9" y1="9" x2="9" y2="15" />
              <line x1="15" y1="9" x2="15" y2="15" />
              <rect x="16" y="2" width="5" height="5" fill="currentColor" stroke="none" />
            </symbol>
            <symbol id="sym-plafonnier" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="8" />
              <line x1="6.3" y1="6.3" x2="17.7" y2="17.7" />
              <line x1="17.7" y1="6.3" x2="6.3" y2="17.7" />
            </symbol>
            <symbol id="sym-applique" viewBox="0 0 24 24">
              <circle cx="9" cy="12" r="6" />
              <line x1="15" y1="12" x2="21" y2="12" />
              <line x1="14" y1="8" x2="19" y2="4" />
              <line x1="14" y1="16" x2="19" y2="20" />
            </symbol>
            <symbol id="sym-spot" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="8" />
              <circle cx="12" cy="12" r="3.5" fill="currentColor" stroke="none" />
            </symbol>
            <symbol id="sym-interrupteur" viewBox="0 0 24 24">
              <line x1="5" y1="19" x2="18" y2="6" />
              <line x1="18" y1="6" x2="22" y2="9" />
              <circle cx="8" cy="16" r="3" />
            </symbol>
            <symbol id="sym-va-et-vient" viewBox="0 0 24 24">
              <line x1="5" y1="19" x2="18" y2="6" />
              <line x1="18" y1="6" x2="22" y2="9" />
              <line x1="5" y1="19" x2="2" y2="16" />
              <circle cx="8" cy="16" r="3" />
            </symbol>
            <symbol id="sym-poussoir" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="8" />
              <rect x="8.5" y="8.5" width="7" height="7" />
            </symbol>
            <symbol id="sym-variateur" viewBox="0 0 24 24">
              <line x1="5" y1="19" x2="18" y2="6" />
              <line x1="18" y1="6" x2="22" y2="9" />
              <circle cx="8" cy="16" r="3" />
              <polygon points="12,9 16,9 16,13" fill="currentColor" stroke="none" />
            </symbol>
            <symbol id="sym-tableau" viewBox="0 0 24 24">
              <rect x="3" y="4" width="18" height="16" rx="1" />
              <line x1="8" y1="8" x2="8" y2="16" />
              <line x1="12" y1="8" x2="12" y2="16" />
              <line x1="16" y1="8" x2="16" y2="16" />
            </symbol>
            <symbol id="sym-vmc" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="8" />
              <path d="M12 12 L12 5 A7 7 0 0 1 18.5 9 Z" fill="currentColor" stroke="none" />
              <path d="M12 12 L18.5 15 A7 7 0 0 1 8 18.5 Z" fill="currentColor" stroke="none" />
              <path d="M12 12 L6 15 A7 7 0 0 1 8 6 Z" fill="currentColor" stroke="none" />
            </symbol>
          </defs>
          <g id="plan-layer"></g>
          <g id="components-layer"></g>
          <g id="links-layer"></g>
        </svg>
        <p id="stage-error" class="stage__error" hidden></p>
      </main>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
